<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hebrew Vowel Recorder</title>
<link rel="stylesheet" href="web/style.css?v=8">
<script type="module" src="web/app.js?v=9"></script>
</head>
<body>
<main>
  <aside aria-label="Hebrew vowels">
    <div id="vowels" role="radiogroup" aria-label="Choose a vowel"></div>
  </aside>
  <section class="lesson" aria-labelledby="practice-title">
    <h1 id="practice-title">Letter and vowel practice</h1>
    <div class="card practice">
      <p id="pair-position" aria-live="polite">Pair 1 of 25</p>
      <button id="pair" lang="he" dir="rtl" disabled>יַ טֶ</button>
      <div class="pair-navigation">
        <button id="previous" disabled>Previous</button>
        <button id="next" disabled>Next</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
    <section class="card recorder" aria-label="Sound recorder" hidden>
      <div id="actions">
        <span id="symbol" class="symbol" lang="he" dir="rtl" hidden></span>
        <button id="record" disabled>Record pair</button>
        <button id="record-vowel" disabled>Record vowel</button>
        <button id="save" hidden>Save recording</button>
      </div>
    </section>
    <audio id="player" hidden></audio>
  </section>
</main>
</body>
</html>
