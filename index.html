<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hebrew Vowel Recorder</title>
<link rel="stylesheet" href="web/style.css?v=5">
<script type="module" src="web/app.js?v=5"></script>
</head>
<body>
<main>
  <aside aria-label="Hebrew vowels">
    <div id="vowels" role="radiogroup" aria-label="Choose a vowel"></div>
    <p id="progress">Loading recordings…</p>
  </aside>
  <section class="lesson" aria-labelledby="practice-title">
    <h1 id="practice-title">Letter and vowel practice</h1>
    <ul id="practice" class="card" lang="he" dir="rtl">
      <li>מַ</li>
      <li>מֶ</li>
      <li>מִ</li>
      <li>מֹ</li>
      <li>מֻ</li>
      <li>נַ</li>
      <li>נֶ</li>
      <li>נִ</li>
      <li>נֹ</li>
      <li>נֻ</li>
      <li>לַ</li>
      <li>לֶ</li>
      <li>לִ</li>
      <li>לֹ</li>
      <li>לֻ</li>
      <li>רַ</li>
      <li>רֶ</li>
      <li>רִ</li>
      <li>רֹ</li>
      <li>רֻ</li>
      <li>שַׁ</li>
      <li>שֶׁ</li>
      <li>שִׁ</li>
      <li>שֹׁ</li>
      <li>שֻׁ</li>
    </ul>
    <section class="card recorder" aria-label="Vowel recorder">
      <div id="actions">
        <span id="symbol" class="symbol" lang="he" dir="rtl"></span>
        <button id="record" disabled>Record sound</button>
        <button id="save" hidden>Save recording</button>
      </div>
      <audio id="player" controls hidden></audio>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </section>
</main>
</body>
</html>
