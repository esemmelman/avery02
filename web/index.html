<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hebrew Vowel Recorder</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main>
  <aside aria-label="Hebrew vowels">
    <h2>Vowels <span lang="he" dir="rtl">נִקּוּד</span></h2>
    <nav id="vowels" aria-label="Choose a vowel"></nav>
    <p id="progress">Loading recordings…</p>
  </aside>
  <section aria-labelledby="title">
    <p class="heading">Hebrew vowel recorder</p>
    <div class="card">
      <div id="symbol" class="symbol" lang="he" dir="rtl"></div>
      <h1 id="title"></h1>
      <p id="instruction">Select a vowel and record its sound.</p>
      <div id="actions">
        <button id="record" disabled>Record sound</button>
        <button id="save" hidden>Save recording</button>
      </div>
      <audio id="player" controls hidden></audio>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </section>
</main>
</body>
</html>
